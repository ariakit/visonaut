name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment or schema migration action
        type: choice
        options: [migrate, preview-web, production-fence]
        default: migrate
        required: true
      target:
        description: Production backend or public preview fixture demo
        type: choice
        options: [production, preview]
        default: production
        required: true
      write_fence:
        description: HTTP writers, cron, consumers and old attempts are fenced/drained
        type: boolean
        default: false
        required: true
      consumers_fenced:
        description: Acknowledge readback of paused delivery or saved/removed consumers; this input is not proof
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # A squash merge of a current branch has the tree that the checks of the pull
  # request tested. Only the output "skip" of this job stops the suite, and only
  # for a push. A job that needs this one, directly or through another job, has
  # a status function in its condition: without one, GitHub skips it when this
  # job or the suite is skipped.
  tested:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A fault of this job must not fail a run that then tests and deploys.
    continue-on-error: true
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      suite: ${{ steps.tested.outputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      # The script uses only built-in modules, so it runs with the Node.js of the runner.
      - id: tested
        name: Test if the suite passed for the tree of this commit
        run: node .github/workflows/scripts/deploy-tested-tree.mjs
        env:
          GH_TOKEN: ${{ github.token }}
        # A fault of this step gives no output, and the suite then runs.
        continue-on-error: true
  verify:
    needs: tested
    if: >-
      !cancelled() &&
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' &&
        inputs.action == 'migrate') &&
      !(github.event_name == 'push' &&
        needs.tested.outputs.suite == 'skip')
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  # The suite takes some minutes. A push in that time supersedes this run, and
  # the deploy job is then skipped, not failed.
  tip:
    needs: [tested, verify]
    if: >-
      !cancelled() &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.tested.outputs.suite == 'skip')) &&
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      # The script uses only built-in modules, so it runs with the Node.js of the runner.
      - id: tip
        name: Test if this commit is the tip of main
        run: node .github/workflows/scripts/deploy-tip.mjs
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the output "false" stops a run. A fault of this step must not
        # stop a deploy: deploy-source.mjs in the deploy job is the hard stop.
        continue-on-error: true
  deploy:
    needs: [tested, verify, tip]
    # Manual cutover dispatch never activates this job. It starts after a suite
    # that passed, or after no suite when the job tested proved the tree.
    if: >-
      !cancelled() &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.tested.outputs.suite == 'skip')) &&
      needs.tip.result == 'success' &&
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.tip.outputs.deploy != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build for production before loading deployment secrets
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Require the current main commit and production build
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the dedicated flat secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Load the deployment credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Load the independent migration credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_MIGRATIONS_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Require both independent credentials
        run: node .github/workflows/scripts/deploy-credentials.mjs
      - name: Require current Container drain evidence before class retirement
        run: node .github/workflows/scripts/deploy-infrastructure.mjs
        env:
          VISONAUT_CONTAINER_RETIREMENT_VERIFIED: ${{ vars.VISONAUT_CONTAINER_RETIREMENT_VERIFIED }}
      - name: Require detached comparison consumers before handler retirement
        run: node .github/workflows/scripts/deploy-comparison-retirement.mjs
        env:
          VISONAUT_COMPARISON_RETIREMENT_TARGET: production
      - name: Apply production schema migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_MIGRATIONS_API_TOKEN }}
      - name: Deploy production comparator
        run: pnpm exec wrangler deploy --config apps/compare/wrangler.jsonc --env production
      - name: Deploy production web worker
        # /health returns this tag as the version.
        run: pnpm exec wrangler deploy --config apps/web/dist/server/wrangler.json --tag "$GITHUB_SHA"
      - name: Read the deployed version back from production
        run: node .github/workflows/scripts/deploy-readback.mjs
  schema-migration:
    needs: verify
    if: >-
      !cancelled() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'migrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: b04f3af3f0f10a6b9481bc23ba974eca
      VISONAUT_MIGRATION_TARGET: ${{ inputs.target }}
      VISONAUT_MIGRATION_WRITE_FENCE: ${{ inputs.write_fence }}
      VISONAUT_MIGRATION_CONSUMERS_FENCED: ${{ inputs.consumers_fenced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require the current main source
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Verify the exact existing secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Check the exact target and fence acknowledgments
        run: |
          node --input-type=module <<'JS'
          const { VISONAUT_MIGRATION_TARGET: target,
            VISONAUT_MIGRATION_WRITE_FENCE: fence } = process.env;
          if (target !== 'production' ||
              process.env.CLOUDFLARE_ACCOUNT_ID !== 'b04f3af3f0f10a6b9481bc23ba974eca') {
            throw new Error('Invalid migration target.');
          }
          if (fence !== 'true' ||
              process.env.VISONAUT_MIGRATION_CONSUMERS_FENCED !== 'true') {
            throw new Error('Migration requires writer and consumer fence acknowledgments; these inputs are not proof.');
          }
          JS
      - name: Check the exact migration target before loading secrets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { unstable_readConfig } from 'wrangler';
          assert.equal(existsSync('apps/web/.wrangler/deploy/config.json'), false,
            'Migrations must not use a redirected application build.');
          const configuration = unstable_readConfig({ config: 'apps/web/wrangler.jsonc', env: 'production' });
          assert.deepEqual(configuration.d1_databases.map(({ binding, database_id }) => ({ binding, database_id })), [{
            binding: 'DB', database_id: '3c0b122f-9186-4d34-80a8-09a50eed2cc1'
          }]);
          JS
      - name: Load only the existing deployment key at its reviewed root path
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Load only the existing independent migration key at its reviewed root path
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_MIGRATIONS_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Require the existing independent migration credential
        run: node .github/workflows/scripts/deploy-credentials.mjs
      - name: Apply only the selected existing D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_MIGRATIONS_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 8192
          migration_command=(pnpm exec wrangler d1 migrations apply DB --remote
            --config apps/web/wrangler.jsonc --env production)
          set +e
          timeout --signal=TERM --kill-after=15s 300s "${migration_command[@]}" \
            >"$RUNNER_TEMP/visonaut-migration-stdout.log" \
            2>"$RUNNER_TEMP/visonaut-migration-stderr.log"
          migration_exit=$?
          set -e
          export VISONAUT_MIGRATION_EXIT="$migration_exit"
          node --input-type=module <<'JS'
          console.log(JSON.stringify({
            action: 'migrate', target: process.env.VISONAUT_MIGRATION_TARGET,
            commandExit: Number(process.env.VISONAUT_MIGRATION_EXIT),
            state: 'Unknown until exact-target UI ledger and schema readback; fence acknowledgments are not proof. No automatic retry.'
          }));
          JS
          if [ "$migration_exit" -ne 0 ]; then
            exit 1
          fi

  web-cutover:
    needs: verify
    # The job tested is skipped for a dispatch, so this job names the result
    # of the suite that it needs.
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      ((inputs.action == 'preview-web' && inputs.target == 'preview') ||
       (inputs.action == 'production-fence' && inputs.target == 'production' && inputs.consumers_fenced == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: b04f3af3f0f10a6b9481bc23ba974eca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build only the preview application before loading secrets
        if: inputs.action == 'preview-web'
        run: env -u CLOUDFLARE_ENV pnpm build
      - name: Require current main
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Verify the exact existing secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Check the exact web target before loading secrets
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { constants, copyFileSync, existsSync, readFileSync } from 'node:fs';
          import { experimental_patchConfig, unstable_readConfig } from 'wrangler';
          const preview = process.env.VISONAUT_WEB_ACTION === 'preview-web';
          assert(preview || process.env.VISONAUT_WEB_ACTION === 'production-fence', 'Invalid web deployment action');
          if (!preview) {
            assert.equal(existsSync('apps/web/.wrangler/deploy/config.json'), false, 'The fence must not use a redirected application build');
          }
          const original = preview ? 'apps/web/dist/server/wrangler.json' : 'apps/web/wrangler.jsonc';
          const temporary = preview ? 'apps/web/dist/server/cutover-wrangler.json' : 'apps/web/cutover-wrangler.jsonc';
          const originalConfiguration = preview
            ? JSON.parse(readFileSync(original, 'utf8'))
            : unstable_readConfig({ config: original, env: 'production' });
          assert.deepEqual(originalConfiguration.queues.consumers, preview ? [] : [{
            queue: 'visonaut-production-operations',
            max_batch_size: 1,
            max_batch_timeout: 1,
            max_concurrency: 1,
            max_retries: 5,
            retry_delay: 60,
            dead_letter_queue: 'visonaut-production-dead-letter'
          }]);
          // Sibling copies preserve relative entrypoint, asset, and migration paths.
          copyFileSync(original, temporary, constants.COPYFILE_EXCL);
          if (!preview) {
            // Deploy must not restore a consumer removed for the cutover fence.
            experimental_patchConfig(temporary, { env: { production: { queues: { consumers: [] } } } }, false);
          }
          const configuration = preview
            ? JSON.parse(readFileSync(temporary, 'utf8'))
            : unstable_readConfig({ config: temporary, env: 'production' });
          assert.equal(configuration.name, preview ? 'visonaut-preview' : 'visonaut');
          assert.equal(configuration.vars?.VISONAUT_ENVIRONMENT, preview ? 'preview' : 'production');
          assert.equal(configuration.vars?.VISONAUT_ORIGIN, preview ? 'https://preview.visonaut.com' : 'https://visonaut.com');
          assert.equal(configuration.vars?.VISONAUT_LAUNCH_ENABLED, preview ? 'false' : 'true');
          assert.deepEqual(configuration.d1_databases.map(({ binding, database_id }) => ({ binding, database_id })), preview ? [] : [{
            binding: 'DB', database_id: '3c0b122f-9186-4d34-80a8-09a50eed2cc1'
          }]);
          assert.deepEqual(configuration.r2_buckets.map(({ binding, bucket_name }) => ({ binding, bucket_name })), preview ? [] : [
            { binding: 'IMAGES', bucket_name: 'visonaut-images' },
            { binding: 'QUARANTINE', bucket_name: 'visonaut-quarantine' }
          ]);
          assert.deepEqual(configuration.services.map(({ binding, service }) => ({ binding, service })), preview ? [] : [
            { binding: 'COMPARATOR', service: 'visonaut-compare' }
          ]);
          assert.deepEqual(configuration.queues.consumers, []);
          assert.deepEqual(configuration.triggers.crons, preview ? [] : ['*/5 * * * *']);
          assert.equal(configuration.observability.enabled, true);
          assert.equal(configuration.observability.traces.enabled, true);
          assert.equal(configuration.preview_urls, false);
          assert.equal(configuration.workers_dev, true);
          assert.deepEqual(configuration.routes, preview
            ? [{ pattern: 'preview.visonaut.com', custom_domain: true, zone_name: 'visonaut.com' }]
            : [{ pattern: 'visonaut.com', custom_domain: true }]);
          assert.deepEqual(configuration.queues.producers.map(({ binding, queue }) => ({ binding, queue })), preview ? [] : [
            { binding: 'OPERATIONS', queue: 'visonaut-production-operations' }
          ]);
          assert.equal(configuration.migrations?.length ?? 0, 0);
          assert.equal(configuration.containers?.length ?? 0, 0);
          assert.equal(configuration.durable_objects?.bindings?.length ?? 0, 0);
          JS
      - name: Dry-run only the selected deployment
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          if [ "$VISONAUT_WEB_ACTION" = preview-web ]; then
            pnpm exec wrangler deploy --config apps/web/dist/server/cutover-wrangler.json --dry-run
          else
            pnpm exec wrangler deploy apps/web/src/cutover-fence.ts --config apps/web/cutover-wrangler.jsonc --env production --dry-run
          fi
      - name: Load only the existing deployment key at its reviewed root path
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Deploy only the selected Worker
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "$VISONAUT_WEB_ACTION" = preview-web ]; then
            pnpm exec wrangler deploy --config apps/web/dist/server/cutover-wrangler.json
          else
            pnpm exec wrangler deploy apps/web/src/cutover-fence.ts --config apps/web/cutover-wrangler.jsonc --env production
          fi
      - name: Remove temporary consumer-free deployment configs
        if: always()
        run: rm -f -- apps/web/dist/server/cutover-wrangler.json apps/web/cutover-wrangler.jsonc
