name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Temporary cutover action; normal deployment remains held
        type: choice
        options: [inspect, convert, migrate, preview-web, production-fence]
        default: inspect
        required: true
      target:
        description: Existing exact database and images bucket
        type: choice
        options: [production, preview]
        default: production
        required: true
      write_fence:
        description: HTTP writers, cron, consumers and old attempts are fenced/drained
        type: boolean
        default: false
        required: true
      consumers_fenced:
        description: Acknowledge readback of paused delivery or saved/removed consumers; this input is not proof
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    # Temporary hold: remove only after reviewed same-target conversion and fence proof.
    # Manual cutover dispatch never activates this job.
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main' && github.event_name == 'push' && false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build for production before loading deployment secrets
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Require the current main commit and production build
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the dedicated flat secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Load the deployment credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Load the independent migration credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /
          secret-name: CLOUDFLARE_MIGRATIONS_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Require both independent credentials
        run: node .github/workflows/scripts/deploy-credentials.mjs
      - name: Require current Container drain evidence before class retirement
        run: node .github/workflows/scripts/deploy-infrastructure.mjs
        env:
          VISONAUT_CONTAINER_RETIREMENT_VERIFIED: ${{ vars.VISONAUT_CONTAINER_RETIREMENT_VERIFIED }}
      - name: Apply production schema migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_MIGRATIONS_API_TOKEN }}
      - name: Deploy production comparator
        run: pnpm exec wrangler deploy --config apps/compare/wrangler.jsonc --env production
      - name: Deploy production web worker
        run: pnpm exec wrangler deploy --config apps/web/dist/server/wrangler.json
  cutover:
    needs: verify
    if: >-
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["inspect","convert","migrate"]'), inputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: b04f3af3f0f10a6b9481bc23ba974eca
      VISONAUT_CUTOVER_ACTION: ${{ inputs.action }}
      VISONAUT_CUTOVER_TARGET: ${{ inputs.target }}
      VISONAUT_CUTOVER_WRITE_FENCE: ${{ inputs.write_fence }}
      VISONAUT_CUTOVER_CONSUMERS_FENCED: ${{ inputs.consumers_fenced }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require the current main source
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Verify the exact existing secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Check the fixed action, target and fence acknowledgement
        run: |
          node --input-type=module <<'JS'
          const { VISONAUT_CUTOVER_ACTION: action, VISONAUT_CUTOVER_TARGET: target,
            VISONAUT_CUTOVER_WRITE_FENCE: fence } = process.env;
          if (!['inspect', 'convert', 'migrate'].includes(action) ||
              !['production', 'preview'].includes(target) ||
              process.env.CLOUDFLARE_ACCOUNT_ID !== 'b04f3af3f0f10a6b9481bc23ba974eca') {
            throw new Error('Invalid cutover action or exact target.');
          }
          if (action === 'convert' && fence !== 'true') {
            throw new Error('The existing external writer fence must be acknowledged.');
          }
          if (action === 'migrate' && (fence !== 'true' ||
              process.env.VISONAUT_CUTOVER_CONSUMERS_FENCED !== 'true')) {
            throw new Error('Migration requires writer and consumer fence acknowledgments; these inputs are not proof.');
          }
          JS
      - name: Check the exact migration target before loading secrets
        if: inputs.action == 'migrate'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { unstable_readConfig } from 'wrangler';
          assert.equal(existsSync('apps/web/.wrangler/deploy/config.json'), false,
            'Migrations must not use a redirected application build.');
          const production = process.env.VISONAUT_CUTOVER_TARGET === 'production';
          const configuration = unstable_readConfig({ config: 'apps/web/wrangler.jsonc',
            ...(production ? { env: 'production' } : {}) });
          assert.deepEqual(configuration.d1_databases.map(({ binding, database_id }) => ({ binding, database_id })), [{
            binding: 'DB', database_id: production
              ? '15fcd402-dccb-4359-a1ce-280ff67ca596' : '395b539c-c423-4ce4-887c-a5792792a63b'
          }]);
          JS
      - name: Verify the runner launcher before loading the credential
        if: inputs.action == 'inspect' || inputs.action == 'convert'
        run: pnpm exec node apps/web/tooling/simplification-cutover/run.mjs --help >/dev/null
      - name: Load only the existing deployment key at its reviewed old path
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /ci/visonaut-deploy
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Load only the existing independent migration key at its reviewed old path
        if: inputs.action == 'migrate'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /ci/visonaut-deploy
          secret-name: CLOUDFLARE_MIGRATIONS_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Require the existing independent migration credential
        if: inputs.action == 'migrate'
        run: node .github/workflows/scripts/deploy-credentials.mjs
      - name: Require the selected existing credential
        run: |
          node --input-type=module <<'JS'
          if (!process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('The existing cutover credential is missing.');
          }
          JS
      - name: Apply only the selected existing D1 migrations
        if: inputs.action == 'migrate'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_MIGRATIONS_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 8192
          migration_command=(pnpm exec wrangler d1 migrations apply DB --remote
            --config apps/web/wrangler.jsonc)
          if [ "$VISONAUT_CUTOVER_TARGET" = production ]; then
            migration_command+=(--env production)
          fi
          set +e
          timeout --signal=TERM --kill-after=15s 300s "${migration_command[@]}" \
            >"$RUNNER_TEMP/visonaut-migration-stdout.log" \
            2>"$RUNNER_TEMP/visonaut-migration-stderr.log"
          migration_exit=$?
          set -e
          export VISONAUT_MIGRATION_EXIT="$migration_exit"
          node --input-type=module <<'JS'
          console.log(JSON.stringify({
            action: 'migrate', target: process.env.VISONAUT_CUTOVER_TARGET,
            commandExit: Number(process.env.VISONAUT_MIGRATION_EXIT),
            state: 'Unknown until exact-target UI ledger and schema readback; fence acknowledgments are not proof. No automatic retry.'
          }));
          JS
          if [ "$migration_exit" -ne 0 ]; then
            exit 1
          fi
      - name: Run only the existing bounded cutover runner
        if: inputs.action == 'inspect' || inputs.action == 'convert'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 8192
          if [ "$VISONAUT_CUTOVER_TARGET" = production ]; then
            cutover_database=15fcd402-dccb-4359-a1ce-280ff67ca596
            cutover_bucket=visonaut-production-images
          else
            cutover_database=395b539c-c423-4ce4-887c-a5792792a63b
            cutover_bucket=visonaut-preview-images
          fi
          cutover_command=(pnpm exec node apps/web/tooling/simplification-cutover/run.mjs
            "$VISONAUT_CUTOVER_ACTION" --remote --environment "$VISONAUT_CUTOVER_TARGET"
            --database-id "$cutover_database" --images-bucket "$cutover_bucket")
          if [ "$VISONAUT_CUTOVER_ACTION" = convert ]; then
            cutover_command+=(--max-turns 1 --acknowledge-write-fence)
          fi
          set +e
          timeout --signal=TERM --kill-after=15s 300s "${cutover_command[@]}" \
            >"$RUNNER_TEMP/visonaut-cutover-report.log" \
            2>"$RUNNER_TEMP/visonaut-cutover-stderr.log"
          cutover_exit=$?
          set -e
          export VISONAUT_CUTOVER_EXIT="$cutover_exit"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const invalid = () => {
            const stderrPath = join(process.env.RUNNER_TEMP, 'visonaut-cutover-stderr.log');
            const markers = statSync(stderrPath).size <= 1048576
              ? [...readFileSync(stderrPath, 'utf8').matchAll(/^\{"code":"cutover-runner-failed","stage":"(before-bindings|binding-setup|after-bindings)","knownApiAuthorizationError":(true|false)\}$/gm)] : [];
            console.log(JSON.stringify({
              commandExit: Number(process.env.VISONAUT_CUTOVER_EXIT),
              stdoutBytes: statSync(join(process.env.RUNNER_TEMP, 'visonaut-cutover-report.log')).size,
              failureStage: markers.length === 1 ? markers[0][1] : 'unclassified',
              knownApiAuthorizationError: markers.length === 1 && markers[0][2] === 'true',
              reportStatus: 'missing-or-invalid'
            }));
            throw new Error('Cutover report is missing or invalid. State and remote cleanup are unknown; inspect before retry.');
          };
          const path = join(process.env.RUNNER_TEMP, 'visonaut-cutover-report.log');
          if (statSync(path).size > 1048576) invalid();
          const bytes = readFileSync(path);
          const text = bytes.toString('utf8');
          const start = text.lastIndexOf('\n{\n  "action": ');
          let report;
          try { report = JSON.parse(start < 0 ? text : text.slice(start + 1)); } catch { invalid(); }
          const target = process.env.VISONAUT_CUTOVER_TARGET;
          const expected = target === 'production'
            ? ['15fcd402-dccb-4359-a1ce-280ff67ca596', 'visonaut-production-images']
            : ['395b539c-c423-4ce4-887c-a5792792a63b', 'visonaut-preview-images'];
          const state = report?.readback;
          const count = value => value === null || (Number.isSafeInteger(value) && value >= 0);
          if (report?.action !== process.env.VISONAUT_CUTOVER_ACTION || report.mode !== 'remote' ||
              report.environment !== target || report.target?.accountId !== 'b04f3af3f0f10a6b9481bc23ba974eca' ||
              report.target?.databaseId !== expected[0] || report.target?.imagesBucket !== expected[1] ||
              !Array.isArray(report.turns) || report.turns.length > (report.action === 'convert' ? 1 : 0) ||
              !['ready', 'not-ready', 'attention', 'no-progress', 'turn-limit'].includes(report.stop) ||
              typeof state?.schemaReady !== 'boolean' || typeof state?.gatesReady !== 'boolean' ||
              !count(state.requiredProtectedSnapshots) || !count(state.unconvertedClosedRecords) ||
              !(state.unresolvedEvents === null || Array.isArray(state.unresolvedEvents)) ||
              !(state.foreignKeyViolations === null || Array.isArray(state.foreignKeyViolations))) invalid();
          console.log(JSON.stringify({
            sourceSha: process.env.GITHUB_SHA, action: report.action, environment: target,
            target: { accountId: report.target.accountId, databaseId: expected[0], imagesBucket: expected[1] },
            commandExit: Number(process.env.VISONAUT_CUTOVER_EXIT), stop: report.stop,
            turns: report.turns.length, schemaReady: state.schemaReady, gatesReady: state.gatesReady,
            requiredProtectedSnapshots: state.requiredProtectedSnapshots,
            unconvertedClosedRecords: state.unconvertedClosedRecords,
            unresolvedEventCount: state.unresolvedEvents === null ? null : state.unresolvedEvents.length,
            foreignKeyViolationCount: state.foreignKeyViolations === null ? null : state.foreignKeyViolations.length,
            privateReportSha256: createHash('sha256').update(bytes).digest('hex'),
            claim: 'Selected conversion counts only; no all-object, writer-fence, hosted recovery or cleanup proof.'
          }));
          JS
          if [ "$cutover_exit" -ne 0 ]; then
            printf '%s\n' 'Cutover stopped; inspect the saved D1 state before another explicit dispatch. No automatic retry.'
            exit 1
          fi

  web-cutover:
    needs: verify
    if: >-
      github.repository_id == '1380751023' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.consumers_fenced == true &&
      ((inputs.action == 'preview-web' && inputs.target == 'preview') ||
       (inputs.action == 'production-fence' && inputs.target == 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: b04f3af3f0f10a6b9481bc23ba974eca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build only the preview application before loading secrets
        if: inputs.action == 'preview-web'
        run: env -u CLOUDFLARE_ENV pnpm build
      - name: Require current main
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Verify the exact existing secret scope
        run: node .github/workflows/scripts/deploy-scope.mjs
        env:
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_DEPLOY_IDENTITY_ID: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
      - name: Check the exact web target before loading secrets
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { constants, copyFileSync, existsSync, readFileSync } from 'node:fs';
          import { experimental_patchConfig, unstable_readConfig } from 'wrangler';
          const preview = process.env.VISONAUT_WEB_ACTION === 'preview-web';
          if (!preview) {
            assert.equal(existsSync('apps/web/.wrangler/deploy/config.json'), false, 'The fence must not use a redirected application build');
          }
          const original = preview ? 'apps/web/dist/server/wrangler.json' : 'apps/web/wrangler.jsonc';
          const temporary = preview ? 'apps/web/dist/server/cutover-wrangler.json' : 'apps/web/cutover-wrangler.jsonc';
          const originalConfiguration = preview
            ? JSON.parse(readFileSync(original, 'utf8'))
            : unstable_readConfig({ config: original, env: 'production' });
          const prefix = preview ? 'visonaut-preview' : 'visonaut-production';
          assert.deepEqual(originalConfiguration.queues.consumers.map(({ queue }) => queue), [`${prefix}-operations`]);
          // Deploy must not restore a consumer removed for the cutover fence.
          // Sibling copies preserve relative entrypoint, asset, and migration paths.
          copyFileSync(original, temporary, constants.COPYFILE_EXCL);
          experimental_patchConfig(temporary, preview
            ? { queues: { consumers: [] } }
            : { env: { production: { queues: { consumers: [] } } } }, false);
          const configuration = preview
            ? JSON.parse(readFileSync(temporary, 'utf8'))
            : unstable_readConfig({ config: temporary, env: 'production' });
          assert.equal(configuration.name, preview ? 'visonaut-preview' : 'visonaut');
          assert.equal(configuration.vars?.VISONAUT_ENVIRONMENT, preview ? 'preview' : 'production');
          assert.deepEqual(configuration.d1_databases.map(({ binding, database_id }) => ({ binding, database_id })), [{
            binding: 'DB', database_id: preview ? '395b539c-c423-4ce4-887c-a5792792a63b' : '15fcd402-dccb-4359-a1ce-280ff67ca596'
          }]);
          assert.deepEqual(configuration.r2_buckets.map(({ binding, bucket_name }) => ({ binding, bucket_name })), [
            { binding: 'IMAGES', bucket_name: `${prefix}-images` },
            { binding: 'QUARANTINE', bucket_name: `${prefix}-quarantine` }
          ]);
          assert.deepEqual(configuration.services.map(({ binding, service }) => ({ binding, service })), [
            { binding: 'COMPARATOR', service: preview ? 'visonaut-preview-compare' : 'visonaut-compare' }
          ]);
          assert.deepEqual(configuration.queues.consumers, []);
          assert.deepEqual(configuration.triggers.crons, preview ? [] : ['*/5 * * * *']);
          assert.equal(configuration.observability.enabled, true);
          assert.equal(configuration.observability.traces.enabled, true);
          assert.equal(configuration.preview_urls, false);
          assert.equal(configuration.workers_dev, true);
          assert.deepEqual(configuration.routes, [{ pattern: preview ? 'preview.visonaut.com' : 'visonaut.com', custom_domain: true }]);
          assert.deepEqual(configuration.queues.producers.map(({ binding, queue }) => ({ binding, queue })), [
            { binding: 'COMPARISONS', queue: `${prefix}-comparisons` },
            { binding: 'OPERATIONS', queue: `${prefix}-operations` }
          ]);
          assert.equal(configuration.migrations?.length ?? 0, 0);
          assert.equal(configuration.containers?.length ?? 0, 0);
          assert.equal(configuration.durable_objects?.bindings?.length ?? 0, 0);
          JS
      - name: Dry-run only the selected web deployment
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          if [ "$VISONAUT_WEB_ACTION" = preview-web ]; then
            pnpm exec wrangler deploy --config apps/web/dist/server/cutover-wrangler.json --dry-run
          else
            pnpm exec wrangler deploy apps/web/src/cutover-fence.ts --config apps/web/cutover-wrangler.jsonc --env production --dry-run
          fi
      - name: Load only the existing deployment key at its reviewed old path
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /ci/visonaut-deploy
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Deploy only the selected web Worker
        env:
          VISONAUT_WEB_ACTION: ${{ inputs.action }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "$VISONAUT_WEB_ACTION" = preview-web ]; then
            pnpm exec wrangler deploy --config apps/web/dist/server/cutover-wrangler.json
          else
            pnpm exec wrangler deploy apps/web/src/cutover-fence.ts --config apps/web/cutover-wrangler.jsonc --env production
          fi
      - name: Remove temporary consumer-free deployment configs
        if: always()
        run: rm -f -- apps/web/dist/server/cutover-wrangler.json apps/web/cutover-wrangler.jsonc
