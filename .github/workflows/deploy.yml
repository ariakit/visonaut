name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build for production before loading deployment secrets
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Require the current main commit and production build
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Load scoped deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DEPLOY_IDENTITY_ID }}
          oidc-audience: visonaut-deploy
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: /ci/visonaut-deploy
          include-imports: "false"
          recursive: "false"
          export-type: env
      - name: Require both independent credentials
        run: node .github/workflows/scripts/deploy-credentials.mjs
      - name: Apply production schema migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_MIGRATIONS_API_TOKEN }}
      - name: Deploy production comparator
        run: node .github/workflows/scripts/deploy-version.mjs apps/compare/wrangler.jsonc visonaut-compare production
      - name: Deploy production web worker
        run: node .github/workflows/scripts/deploy-version.mjs apps/web/dist/server/wrangler.json visonaut
      - name: Deploy GitHub App webhook router
        run: node .github/workflows/scripts/deploy-version.mjs apps/webhook/wrangler.jsonc visonaut-webhook
