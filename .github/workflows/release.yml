name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag for the selected package
        type: choice
        options: [latest, next]
        default: latest
        required: true
      package:
        description: Package to publish from the verified artifact
        type: choice
        options: [both, visonaut, "@visonaut/playwright"]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: verify
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VISONAUT_RELEASE_COMMIT: ${{ vars.VISONAUT_RELEASE_COMMIT }}
      NPM_CONFIG_PROVENANCE: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.package-artifact }}
          path: ${{ runner.temp }}/public-packages
      - name: Publish verified tarballs through npm trusted publishing
        run: node .github/workflows/scripts/packages.mjs publish "$RUNNER_TEMP/public-packages"
        env:
          VISONAUT_RELEASE_TAG: ${{ inputs.tag }}
          VISONAUT_RELEASE_PACKAGE: ${{ inputs.package }}
