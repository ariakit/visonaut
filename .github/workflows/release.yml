name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag for every eligible public package
        type: choice
        options: [latest, next]
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.preflight.outputs.eligible }}
    env:
      VISONAUT_RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.tag }}
      VISONAUT_RELEASE_COMMIT: ${{ github.event_name == 'push' && github.sha || vars.VISONAUT_RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - name: Read the effective Changesets version plan
        if: github.event_name == 'push'
        id: version-plan
        run: |
          pnpm exec changeset status --output "$RUNNER_TEMP/visonaut-version-plan.json"
          node .github/workflows/scripts/packages.mjs version-needed "$RUNNER_TEMP/visonaut-version-plan.json"
      - name: Create the existing release App token
        if: steps.version-plan.outputs.needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ARIAKIT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARIAKIT_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the version pull request
        if: steps.version-plan.outputs.needed == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: Publish
          commit-message: Publish
          version-script: pnpm version-packages
      - name: Build source without a version change
        if: github.event_name == 'workflow_dispatch' || steps.version-plan.outputs.needed == 'false'
        run: pnpm build
      - name: Require the current main source
        if: github.event_name == 'workflow_dispatch' || steps.version-plan.outputs.needed == 'false'
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Install the audited npm verification tool
        if: github.event_name == 'workflow_dispatch' || steps.version-plan.outputs.needed == 'false'
        run: npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
      - name: Smoke-test installed public packages
        if: github.event_name == 'workflow_dispatch' || steps.version-plan.outputs.needed == 'false'
        run: pnpm check:packages
      - name: Select eligible checked versions
        if: github.event_name == 'workflow_dispatch' || steps.version-plan.outputs.needed == 'false'
        id: preflight
        run: node .github/workflows/scripts/packages.mjs preflight
  verify:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: verify
    # Version PRs can run before the first cutover release is ready.
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.VISONAUT_AUTOMATIC_PUBLICATION == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
      VISONAUT_RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.tag }}
      VISONAUT_RELEASE_COMMIT: ${{ github.event_name == 'push' && github.sha || vars.VISONAUT_RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build the verified source
        run: pnpm build
      - name: Require the current main source
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Install the audited npm publication tool
        run: npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
      - name: Smoke-test installed public packages
        run: pnpm check:packages
      - name: Prepare the eligible source and version receipt
        id: preflight
        run: node .github/workflows/scripts/packages.mjs preflight
      - name: Publish the Changesets plan with npm trusted publishing
        if: steps.preflight.outputs.eligible == 'true'
        run: pnpm exec changeset publish --tag "$VISONAUT_RELEASE_TAG" --no-git-tag
      - name: Verify eligible versions, tag, source, and publisher identity
        if: steps.preflight.outputs.eligible == 'true'
        run: node .github/workflows/scripts/packages.mjs result
