name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag for every eligible public package
        type: choice
        options: [latest, next]
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    needs: verify
    if: github.repository_id == '1380751023' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
      VISONAUT_RELEASE_TAG: ${{ inputs.tag }}
      VISONAUT_RELEASE_COMMIT: ${{ vars.VISONAUT_RELEASE_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build the verified source
        run: pnpm build
      - name: Require the current main source
        run: node .github/workflows/scripts/deploy-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VISONAUT_RELEASE_SOURCE_ONLY: "true"
      - name: Install the audited npm publication tool
        run: npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
      - name: Smoke-test installed public packages
        run: pnpm check:packages
      - name: Prepare the eligible source and version receipt
        run: node .github/workflows/scripts/packages.mjs preflight
      - name: Publish the Changesets plan with npm trusted publishing
        run: pnpm exec changeset publish --tag "$VISONAUT_RELEASE_TAG" --no-git-tag
      - name: Verify eligible versions, tag, source, and publisher identity
        run: node .github/workflows/scripts/packages.mjs result
