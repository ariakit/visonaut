name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      package-artifact:
        description: Audited public packages for this exact source commit
        value: ${{ jobs.check.outputs.package-artifact }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      package-artifact: public-packages-${{ github.sha }}
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm check
      - name: Test release guards
        run: node --test .github/workflows/scripts/*.test.mjs
      - name: Pack and audit public packages
        run: node .github/workflows/scripts/packages.mjs pack "$RUNNER_TEMP/public-packages"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-packages-${{ github.sha }}
          path: ${{ runner.temp }}/public-packages/
          if-no-files-found: error
          retention-days: 7
