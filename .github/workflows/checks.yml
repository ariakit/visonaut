name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      package-artifact:
        description: Audited public packages for this exact source commit
        value: ${{ jobs.build.outputs.package-artifact }}

permissions:
  contents: read

env:
  CI: true
  WRANGLER_SEND_METRICS: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      package-artifact: public-packages-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and audit public packages
        run: node .github/workflows/scripts/packages.mjs pack "$RUNNER_TEMP/public-packages"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-packages-${{ github.sha }}
          path: ${{ runner.temp }}/public-packages/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome chromium
      - run: pnpm build
      - run: pnpm test:browser

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Test native comparison Container
        run: |
          npm ci --prefix apps/compare/container --ignore-scripts --no-audit --no-fund --os=linux --cpu=x64 --libc=glibc
          npm test --prefix apps/compare/container
      - name: Build pinned comparison Container image
        run: docker build --platform linux/amd64 --file apps/compare/container/Dockerfile --tag visonaut-compare-check:${{ github.sha }} .

  release-guards:
    name: Release guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: node --test .github/workflows/scripts/*.test.mjs

  gate:
    name: Gate
    if: always()
    needs: [lint, typecheck, build, test, browser, container, release-guards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require every check to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.CI_RESULTS);
            const failed = Object.entries(jobs)
              .filter(([, job]) => job.result !== "success")
              .map(([name, job]) => `${name}: ${job.result}`);
            if (failed.length) {
              console.error(`Required jobs did not succeed: ${failed.join(", ")}`);
              process.exit(1);
            }
          '
